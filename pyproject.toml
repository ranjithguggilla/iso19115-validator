[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iso19115-validator"
version = "1.0.0"
description = "ISO 19115-2, CF-1.8, and ACDD-1.3 metadata linter with Schematron policy rules"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Ranjith Guggilla", email = "ranjithguggilla668@gmail.com"},
]
keywords = [
    "ISO-19115", "metadata", "validation", "geospatial", "NetCDF",
    "CF-conventions", "ACDD", "Schematron", "FAIR", "linter",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "click>=8.1",
    "lxml>=4.9",
    "pyyaml>=6.0",
    "netCDF4>=1.6",
    "jinja2>=3.1",
    "fastapi>=0.100",
    "uvicorn>=0.22",
    "python-multipart>=0.0.6",
    "rich>=13.0",
    "jsonschema>=4.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "httpx>=0.24",
    "respx>=0.20",
]

[project.scripts]
isolint = "isolint.cli:main"

[project.urls]
Repository = "https://github.com/ranjithguggilla/iso19115-validator"
Issues = "https://github.com/ranjithguggilla/iso19115-validator/issues"

[tool.setuptools.packages.find]
include = ["isolint*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
